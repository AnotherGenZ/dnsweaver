# Fork-only: build and publish the multi-arch image to ghcr.io/anothergenz/dnsweaver.
# Upstream releases from GitLab; this file has a fork-only name so upstream syncs never conflict with it.
# Tag format: v<upstream version>-fork.<n>, e.g. v3.3.2-fork.1. Never moves :latest; deployments pin by digest.
name: fork-release
on:
  push:
    tags: ["v*-fork.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v3.3.2-fork.1"
        required: true
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      IMAGE: ghcr.io/anothergenz/dnsweaver
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test before publishing
        run: go test -race -count=1 ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            VERSION=${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/AnotherGenZ/dnsweaver
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Summary
        run: echo "Published \`${IMAGE}:${TAG}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
